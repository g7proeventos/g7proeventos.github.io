<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>G7PRO - Gestão de Eventos</title>
  <meta name="description" content="Cronograma, chaves, lutas e checagem de atletas do evento.">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icone-192.png">
  <style>
    :root {
      --preto: #0f172a; --preto-2: #1e293b; --azul: #1d4ed8; --azul-claro: #dbeafe; --azul-medio: #3b82f6;
      --cinza-1: #f1f5f9; --cinza-2: #e2e8f0; --cinza-3: #94a3b8; --cinza-4: #475569;
      --verde: #15803d; --verde-claro: #dcfce7; --amarelo: #92400e; --amarelo-claro: #fef3c7;
      --raio: 10px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif; background: var(--cinza-1); color: var(--preto); }
    .container { max-width: 1200px; margin: 0 auto; padding: 12px 14px 30px; }

    header { background: #fff; border-radius: var(--raio); border-bottom: 3px solid var(--azul); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; box-shadow: 0 1px 3px rgba(15,23,42,.08); }
    .evento { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .evento img { width: 52px; height: 52px; object-fit: contain; border-radius: 8px; background: #fff; }
    .evento h1 { margin: 0; font-size: 1.25rem; color: var(--azul); line-height: 1.2; text-transform: uppercase; }
    .evento small { color: var(--cinza-4); font-weight: 700; font-size: .75rem; letter-spacing: .5px; text-transform: uppercase; }
    .marca { display: flex; align-items: center; gap: 10px; border: 2px solid var(--preto); border-radius: var(--raio); padding: 4px 14px 4px 6px; background: #fff; }
    .marca img { width: 60px; height: 59px; }
    .marca b { display: block; font-size: 1.5rem; font-weight: 900; letter-spacing: 1px; line-height: 1; }
    .marca b span { color: var(--azul); }
    .marca i { font-style: normal; font-size: .68rem; font-weight: 800; letter-spacing: 1.4px; color: var(--azul); text-transform: uppercase; }

    nav { display: flex; gap: 8px; margin: 14px 0; overflow-x: auto; }
    nav button { border: 1px solid var(--cinza-2); background: #fff; color: var(--cinza-4); font-weight: 800; padding: 10px 16px; border-radius: var(--raio); cursor: pointer; white-space: nowrap; font-size: .95rem; }
    nav button.ativo { background: var(--azul); border-color: var(--azul); color: #fff; }

    .filtros { background: #fff; border: 1px solid var(--cinza-2); border-radius: var(--raio); padding: 12px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
    .filtros select, .filtros input { padding: 9px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: .95rem; font-weight: 600; background: #fff; color: var(--preto); }
    .filtros input { flex: 1; min-width: 200px; }
    .aviso { font-size: .8rem; color: var(--cinza-4); margin: -4px 0 12px 4px; }

    .bloco { background: #fff; border: 1px solid var(--cinza-2); border-radius: var(--raio); margin-bottom: 14px; overflow: hidden; }
    .bloco-titulo { background: var(--preto); color: #fff; font-weight: 800; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    .bloco-titulo small { font-weight: 700; opacity: .8; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th { text-align: left; font-size: .72rem; letter-spacing: .5px; text-transform: uppercase; color: var(--cinza-4); background: var(--cinza-1); padding: 8px 10px; }
    td { padding: 9px 10px; border-top: 1px solid var(--cinza-2); vertical-align: middle; }
    td.hora { font-weight: 900; font-size: 1rem; white-space: nowrap; color: var(--azul); }
    td .eq { display: block; font-size: .75rem; color: var(--cinza-3); font-weight: 600; }
    .vs { text-align: center; color: var(--cinza-3); font-weight: 800; width: 20px; }

    .selo { display: inline-block; font-size: .72rem; font-weight: 900; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
    .s-enc { background: var(--verde-claro); color: var(--verde); }
    .s-cham { background: var(--amarelo-claro); color: var(--amarelo); }
    .s-prox { background: var(--azul-claro); color: var(--azul); }
    .s-agu { background: var(--cinza-1); color: var(--cinza-4); }
    .s-fin { background: var(--preto); color: #fff; }

    .lutas-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; padding: 12px; }
    .luta { border: 1px solid var(--cinza-2); border-radius: 8px; overflow: hidden; background: #fff; }
    .luta-topo { display: flex; justify-content: space-between; align-items: center; background: var(--cinza-1); padding: 6px 10px; font-size: .8rem; font-weight: 800; color: var(--cinza-4); gap: 8px; }
    .atleta { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; gap: 8px; }
    .atleta + .atleta { border-top: 1px dashed var(--cinza-2); }
    .atleta .nome { font-weight: 800; }
    .atleta.venceu .nome { color: var(--verde); }
    .atleta.venceu .nome::after { content: " ✓"; }
    .atleta.perdeu .nome { color: var(--cinza-3); }
    .resultado { padding: 6px 10px; background: var(--verde-claro); color: var(--verde); font-size: .8rem; font-weight: 800; }

    .chave-rounds { display: flex; gap: 14px; overflow-x: auto; padding: 12px; }
    .round { min-width: 240px; display: flex; flex-direction: column; gap: 10px; justify-content: space-around; }
    .round h4 { margin: 0 0 2px; font-size: .75rem; text-transform: uppercase; letter-spacing: .5px; color: var(--cinza-4); }
    .podio { padding: 10px 14px; border-top: 1px solid var(--cinza-2); display: flex; gap: 18px; flex-wrap: wrap; font-weight: 800; font-size: .9rem; }

    .cat-titulo { background: var(--preto-2); color: #fff; padding: 8px 14px; font-weight: 800; font-size: .85rem; }
    .vazio { background: #fff; border-radius: var(--raio); padding: 40px 20px; text-align: center; color: var(--cinza-3); font-weight: 700; }
    .status-linha { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: .8rem; color: var(--cinza-4); margin: 0 0 10px 4px; }
    .erro { background: #fee2e2; color: #991b1b; border-radius: var(--raio); padding: 10px 14px; font-weight: 700; margin-bottom: 12px; display: none; }
    footer { margin-top: 24px; display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--cinza-4); font-size: .85rem; border-top: 1px solid var(--cinza-2); padding-top: 14px; }
    footer img { width: 48px; height: 47px; }

    @media (max-width: 640px) {
      header { flex-direction: column; align-items: stretch; }
      .marca { justify-content: center; }
      .esconder-mobile { display: none; }
      td, th { padding: 7px 6px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="evento">
        <img id="logoEvento" src="logo-g7pro.png" alt="Logo do evento">
        <div>
          <h1 id="nomeEvento">Carregando evento...</h1>
          <small>Acompanhamento oficial</small>
        </div>
      </div>
      <div class="marca" title="G7PRO - Gestão de Eventos">
        <img src="logo-g7pro.png" alt="G7PRO">
        <div><b>G7<span>PRO</span></b><i>Gestão de Eventos</i></div>
      </div>
    </header>

    <nav>
      <button class="ativo" data-aba="cronograma">🕒 Cronograma</button>
      <button data-aba="chaves">🥊 Chaves e Lutas</button>
      <button data-aba="atletas">👥 Checagem de Atletas</button>
    </nav>

    <div id="erro" class="erro"></div>
    <div class="status-linha"><span id="txtAtualizado">Carregando...</span><span id="txtTotal"></span></div>

    <section id="aba-cronograma">
      <div class="filtros">
        <select id="fAreaCrono"><option value="TODAS">Todas as áreas</option></select>
        <input id="fBuscaCrono" type="search" placeholder="🔍 Buscar atleta ou equipe">
      </div>
      <div class="aviso">Os horários são previsões e podem mudar conforme o andamento do evento. Chegue com antecedência.</div>
      <div id="conteudoCrono"></div>
    </section>

    <section id="aba-chaves" hidden>
      <div class="filtros">
        <select id="fAreaChaves"><option value="TODAS">Todas as áreas</option></select>
        <input id="fBuscaChaves" type="search" placeholder="🔍 Buscar categoria ou atleta">
      </div>
      <div id="conteudoChaves"></div>
    </section>

    <section id="aba-atletas" hidden>
      <div class="filtros">
        <input id="fBuscaAtletas" type="search" placeholder="🔍 Buscar atleta ou equipe">
      </div>
      <div id="conteudoAtletas"></div>
    </section>

    <footer>
      <img src="logo-g7pro.png" alt="G7PRO">
      <span>Sistema <strong>G7PRO - Gestão de Eventos</strong></span>
    </footer>
  </div>

  <script src="config.js"></script>
  <script>
  (function () {
    var CFG = window.G7PRO_CONFIG || {};
    var dados = null;
    var abaAtual = "cronograma";

    function esc(v) {
      return String(v === null || v === undefined ? "" : v)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    function minutos(h) {
      var m = String(h || "").match(/(\d{1,2}):(\d{2})/);
      return m ? parseInt(m[1], 10) * 60 + parseInt(m[2], 10) : 99999;
    }
    function hora(h) { return h ? esc(String(h).replace(":", "h")) : "--"; }
    function num4(n) { return ("0000" + (parseInt(n, 10) || 0)).slice(-4); }
    function norm(s) { return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); }
    function definido(n) {
      var s = String(n || "").toUpperCase();
      return s && s !== "BYE" && s.indexOf("VENCEDOR") === -1 && s.indexOf("AGUARDANDO") === -1;
    }

    // ---------------- CARREGAMENTO ----------------
    function urlApi(extra) {
      var base = String(CFG.URL_API || "");
      return base + (base.indexOf("?") === -1 ? "?" : "&") + "api=publico" + (extra || "");
    }

    function carregarJsonp() {
      return new Promise(function (resolve, reject) {
        var nome = "g7cb_" + Date.now();
        var s = document.createElement("script");
        var t = setTimeout(function () { limpar(); reject(new Error("tempo esgotado")); }, 20000);
        function limpar() { clearTimeout(t); try { delete window[nome]; } catch (e) { window[nome] = undefined; } if (s.parentNode) s.parentNode.removeChild(s); }
        window[nome] = function (d) { limpar(); resolve(d); };
        s.onerror = function () { limpar(); reject(new Error("falha de rede")); };
        s.src = urlApi("&callback=" + nome + "&t=" + Date.now());
        document.body.appendChild(s);
      });
    }

    function carregar() {
      if (!CFG.URL_API || CFG.URL_API.indexOf("script.google.com") === -1) {
        mostrarErro("Configure o link do sistema no arquivo config.js.");
        return;
      }
      fetch(urlApi("&t=" + Date.now()), { method: "GET", redirect: "follow" })
        .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .catch(function () { return carregarJsonp(); })
        .then(function (d) {
          if (!d || d.sucesso === false) throw new Error((d && d.mensagem) || "sem dados");
          dados = d;
          mostrarErro("");
          aplicarEvento();
          preencherAreas();
          renderizar();
          var agora = new Date();
          document.getElementById("txtAtualizado").textContent = "Atualizado às " + ("0" + agora.getHours()).slice(-2) + ":" + ("0" + agora.getMinutes()).slice(-2) + " · atualiza sozinho";
        })
        .catch(function () {
          mostrarErro(dados ? "Sem conexão no momento. Mostrando os últimos dados recebidos." : "Não foi possível carregar os dados do evento. Tentando de novo...");
        });
    }

    function mostrarErro(msg) {
      var el = document.getElementById("erro");
      el.textContent = msg;
      el.style.display = msg ? "block" : "none";
    }

    function aplicarEvento() {
      var ev = dados.evento || {};
      var nome = ev.nome || "Evento";
      document.getElementById("nomeEvento").textContent = nome;
      document.title = nome + " - G7PRO";
      var img = document.getElementById("logoEvento");
      if (ev.logoUrl && img.getAttribute("data-src") !== ev.logoUrl) {
        img.setAttribute("data-src", ev.logoUrl);
        img.onerror = function () { img.src = "logo-g7pro.png"; };
        img.src = ev.logoUrl;
      }
      document.getElementById("txtTotal").textContent = (dados.atletas && dados.atletas.total ? dados.atletas.total + " atletas inscritos" : "");
    }

    function preencherAreas() {
      var total = Math.max(1, (dados.evento && dados.evento.totalAreas) || 1);
      (dados.chaves || []).forEach(function (c) { if (c.area > total) total = c.area; });
      ["fAreaCrono", "fAreaChaves"].forEach(function (id) {
        var sel = document.getElementById(id), atual = sel.value || "TODAS";
        var h = '<option value="TODAS">Todas as áreas</option>';
        for (var a = 1; a <= total; a++) h += '<option value="' + a + '">Área ' + a + '</option>';
        sel.innerHTML = h;
        sel.value = (atual === "TODAS" || parseInt(atual, 10) <= total) ? atual : "TODAS";
      });
    }

    // ---------------- ABA CRONOGRAMA (só horário previsto) ----------------
    function renderCronograma() {
      var area = document.getElementById("fAreaCrono").value;
      var termo = norm(document.getElementById("fBuscaCrono").value.trim());
      var porArea = {};
      (dados.chaves || []).forEach(function (ch) {
        if (area !== "TODAS" && String(ch.area) !== area) return;
        (ch.lutas || []).forEach(function (l) {
          if (l.bye || (!l.nome1 && !l.nome2)) return;
          if (termo && norm(l.nome1 + " " + l.nome2 + " " + l.equipe1 + " " + l.equipe2).indexOf(termo) === -1) return;
          (porArea[ch.area] = porArea[ch.area] || []).push({ l: l, cat: ch.categoria });
        });
      });
      var areas = Object.keys(porArea).map(Number).sort(function (a, b) { return a - b; });
      if (!areas.length) return '<div class="vazio">' + (termo ? "Nenhuma luta encontrada para esta busca." : "O cronograma será publicado assim que as lutas forem definidas.") + '</div>';
      return areas.map(function (a) {
        var lista = porArea[a].sort(function (x, y) { return (minutos(x.l.horaPrevista) - minutos(y.l.horaPrevista)) || (x.l.numLuta - y.l.numLuta); });
        var linhas = lista.map(function (it) {
          var l = it.l;
          return '<tr><td class="hora">' + hora(l.horaPrevista) + '</td><td class="esconder-mobile">#' + num4(l.numLuta) + '</td>' +
            '<td><b>' + esc(l.nome1) + '</b><span class="eq">' + esc(l.equipe1) + '</span></td><td class="vs">x</td>' +
            '<td><b>' + esc(l.nome2) + '</b><span class="eq">' + esc(l.equipe2) + '</span></td>' +
            '<td class="esconder-mobile" style="font-size:.8rem">' + esc(it.cat) + '</td></tr>';
        }).join("");
        return '<div class="bloco"><div class="bloco-titulo">📍 Área ' + a + '<small>' + lista.length + ' luta(s)</small></div>' +
          '<table><thead><tr><th>Previsão</th><th class="esconder-mobile">Luta</th><th>Atleta</th><th></th><th>Atleta</th><th class="esconder-mobile">Categoria</th></tr></thead><tbody>' + linhas + '</tbody></table></div>';
      }).join("");
    }

    // ---------------- ABA CHAVES E LUTAS (andamento) ----------------
    function seloLuta(l, ehProxima) {
      if (l.encerrada) return '<span class="selo s-enc">Encerrada</span>';
      if (l.chamada) return '<span class="selo s-cham">📣 Chamada</span>';
      if (ehProxima) return '<span class="selo s-prox">▶ Próxima</span>';
      return '<span class="selo s-agu">Aguardando</span>';
    }
    function cartaoLuta(l, ehProxima) {
      var v1 = l.encerrada && l.vencedor && l.vencedor === l.nome1;
      var v2 = l.encerrada && l.vencedor && l.vencedor === l.nome2;
      var cl1 = l.encerrada ? (v1 ? "venceu" : (v2 ? "perdeu" : "")) : "";
      var cl2 = l.encerrada ? (v2 ? "venceu" : (v1 ? "perdeu" : "")) : "";
      return '<div class="luta"><div class="luta-topo"><span>Luta ' + num4(l.numLuta) + (l.horaPrevista ? ' · ' + hora(l.horaPrevista) : '') + '</span>' + seloLuta(l, ehProxima) + '</div>' +
        '<div class="atleta ' + cl1 + '"><div><div class="nome">' + esc(l.nome1 || "A definir") + '</div><span class="eq" style="font-size:.75rem;color:#94a3b8">' + esc(l.equipe1) + '</span></div></div>' +
        '<div class="atleta ' + cl2 + '"><div><div class="nome">' + esc(l.nome2 || "A definir") + '</div><span class="eq" style="font-size:.75rem;color:#94a3b8">' + esc(l.equipe2) + '</span></div></div>' +
        (l.encerrada && l.vencedor ? '<div class="resultado">🏆 ' + esc(l.vencedor) + (l.placar && l.placar !== "W.O." ? ' · ' + esc(l.placar) : '') + (l.tipoVitoria ? ' · ' + esc(l.tipoVitoria) : '') + '</div>' : '') +
        '</div>';
    }
    function proximasPorArea() {
      var mapa = {};
      (dados.chaves || []).forEach(function (ch) {
        (ch.lutas || []).forEach(function (l) {
          if (l.bye || l.encerrada || !definido(l.nome1) || !definido(l.nome2)) return;
          var atual = mapa[ch.area];
          if (!atual || minutos(l.horaPrevista) < minutos(atual.horaPrevista) || (minutos(l.horaPrevista) === minutos(atual.horaPrevista) && l.numLuta < atual.numLuta)) mapa[ch.area] = l;
        });
      });
      return mapa;
    }
    function renderChaves() {
      var area = document.getElementById("fAreaChaves").value;
      var termo = norm(document.getElementById("fBuscaChaves").value.trim());
      var prox = proximasPorArea();
      var chaves = (dados.chaves || []).filter(function (ch) {
        if (area !== "TODAS" && String(ch.area) !== area) return false;
        if (!termo) return true;
        var alvo = ch.categoria + " " + (ch.lutas || []).map(function (l) { return l.nome1 + " " + l.nome2 + " " + l.equipe1 + " " + l.equipe2; }).join(" ");
        return norm(alvo).indexOf(termo) !== -1;
      });
      if (!chaves.length) return '<div class="vazio">' + (termo ? "Nada encontrado para esta busca." : "As chaves e lutas aparecem aqui assim que forem definidas.") + '</div>';

      var casadas = chaves.filter(function (ch) { return (ch.lutas || []).filter(function (l) { return !l.bye; }).length <= 1; });
      var eliminatorias = chaves.filter(function (ch) { return (ch.lutas || []).filter(function (l) { return !l.bye; }).length > 1; });
      var html = "";

      if (casadas.length) {
        var porArea = {};
        casadas.forEach(function (ch) { (ch.lutas || []).forEach(function (l) { if (!l.bye) (porArea[ch.area] = porArea[ch.area] || []).push(l); }); });
        Object.keys(porArea).map(Number).sort(function (a, b) { return a - b; }).forEach(function (a) {
          var lista = porArea[a].sort(function (x, y) { return (minutos(x.horaPrevista) - minutos(y.horaPrevista)) || (x.numLuta - y.numLuta); });
          var enc = lista.filter(function (l) { return l.encerrada; }).length;
          html += '<div class="bloco"><div class="bloco-titulo">📍 Área ' + a + ' · Lutas casadas<small>' + enc + ' de ' + lista.length + ' encerradas</small></div><div class="lutas-grid">' +
            lista.map(function (l) { return cartaoLuta(l, prox[a] && prox[a].numLuta === l.numLuta); }).join("") + '</div></div>';
        });
      }

      eliminatorias.forEach(function (ch) {
        var lutas = (ch.lutas || []).slice();
        var rounds = {};
        lutas.forEach(function (l) { var r = l.round || 1; (rounds[r] = rounds[r] || []).push(l); });
        var chavesR = Object.keys(rounds).map(Number).sort(function (a, b) { return a - b; });
        var colunas = chavesR.map(function (r) {
          var ls = rounds[r].sort(function (a, b) { return a.numLuta - b.numLuta; });
          var titulo = (ls[0] && ls[0].fase) || ("Rodada " + r);
          return '<div class="round"><h4>' + esc(titulo) + '</h4>' + ls.map(function (l) {
            if (l.bye) return '<div class="luta"><div class="luta-topo"><span>Luta ' + num4(l.numLuta) + '</span><span class="selo s-agu">BYE</span></div><div class="atleta"><div class="nome">' + esc(definido(l.nome1) ? l.nome1 : l.nome2) + '</div></div></div>';
            return cartaoLuta(l, prox[ch.area] && prox[ch.area].numLuta === l.numLuta);
          }).join("") + '</div>';
        }).join("");
        var fin = String(ch.status || "").toUpperCase().indexOf("FINALIZADA") !== -1;
        var p = ch.podium || {};
        var podio = (p.primeiro || p.segundo) ? '<div class="podio"><span>🥇 ' + esc(p.primeiro || "-") + '</span><span>🥈 ' + esc(p.segundo || "-") + '</span>' +
          (p.terceiros || []).map(function (t) { return '<span>🥉 ' + esc(t) + '</span>'; }).join("") + '</div>' : '';
        html += '<div class="bloco"><div class="bloco-titulo">' + esc(ch.categoria) + '<small>Área ' + ch.area + (fin ? ' · <span class="selo s-fin">Finalizada</span>' : '') + '</small></div>' +
          '<div class="chave-rounds">' + colunas + '</div>' + podio + '</div>';
      });
      return html;
    }

    // ---------------- ABA CHECAGEM DE ATLETAS ----------------
    function renderAtletas() {
      var termo = norm(document.getElementById("fBuscaAtletas").value.trim());
      var cats = (dados.atletas && dados.atletas.porCategoria) || [];
      var html = "", total = 0;
      cats.forEach(function (c) {
        var lista = c.atletas.filter(function (a) { return !termo || norm(a.nome + " " + a.equipe).indexOf(termo) !== -1; });
        if (!lista.length) return;
        total += lista.length;
        html += '<div class="bloco"><div class="cat-titulo">' + esc(c.categoria) + ' · ' + lista.length + ' atleta(s)</div><table><tbody>' +
          lista.map(function (a) {
            return '<tr><td><b>' + esc(a.nome) + '</b><span class="eq">' + esc(a.equipe) + '</span></td><td class="esconder-mobile">' + esc(a.faixa) + '</td><td class="esconder-mobile">' + esc(a.peso) + '</td>' +
              '<td style="text-align:right">' + (a.status === "inapto" ? '<span class="selo" style="background:#fee2e2;color:#991b1b">Inapto</span>' : '<span class="selo s-enc">Apto</span>') + '</td></tr>';
          }).join("") + '</tbody></table></div>';
      });
      if (!total) return '<div class="vazio">' + (termo ? "Nenhum atleta encontrado." : "A lista de atletas aparece aqui assim que as inscrições forem confirmadas.") + '</div>';
      return html;
    }

    function renderizar() {
      if (!dados) return;
      if (abaAtual === "cronograma") document.getElementById("conteudoCrono").innerHTML = renderCronograma();
      if (abaAtual === "chaves") document.getElementById("conteudoChaves").innerHTML = renderChaves();
      if (abaAtual === "atletas") document.getElementById("conteudoAtletas").innerHTML = renderAtletas();
    }

    // ---------------- EVENTOS ----------------
    document.querySelectorAll("nav button").forEach(function (b) {
      b.addEventListener("click", function () {
        abaAtual = b.getAttribute("data-aba");
        document.querySelectorAll("nav button").forEach(function (x) { x.classList.toggle("ativo", x === b); });
        ["cronograma", "chaves", "atletas"].forEach(function (a) { document.getElementById("aba-" + a).hidden = (a !== abaAtual); });
        try { history.replaceState(null, "", "#" + abaAtual); } catch (e) {}
        renderizar();
      });
    });
    ["fAreaCrono", "fBuscaCrono", "fAreaChaves", "fBuscaChaves", "fBuscaAtletas"].forEach(function (id) {
      var el = document.getElementById(id);
      el.addEventListener(el.tagName === "SELECT" ? "change" : "input", renderizar);
    });
    var abaInicial = (location.hash || "").replace("#", "");
    if (["chaves", "atletas"].indexOf(abaInicial) !== -1) document.querySelector('nav button[data-aba="' + abaInicial + '"]').click();

    carregar();
    setInterval(function () { if (!document.hidden) carregar(); }, Math.max(15, Number(CFG.ATUALIZAR_A_CADA_SEGUNDOS) || 30) * 1000);
    document.addEventListener("visibilitychange", function () { if (!document.hidden) carregar(); });
  })();
  </script>
</body>
</html>
